<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>播放器测试</title>
<style>
  body{margin:0;background:#07080c;color:#eef1f8;font:14px/1.6 -apple-system,"PingFang SC",sans-serif;padding:16px}
  h1{font-size:18px;margin:0 0 6px}
  p{color:#8b94a9;font-size:13px;margin:0 0 18px}
  .box{margin-bottom:22px}
  .lab{font-size:13px;color:#9aa6ff;margin-bottom:6px}
  iframe{width:100%;aspect-ratio:16/9;border:1px solid #2a3346;border-radius:12px;background:#000}
</style>
</head>
<body>
<h1>哪个能播？</h1>
<p>下面三段是同一个视频、三种写法。哪个能出画面/出声，就告诉我它的编号（1 / 2 / 3）。</p>

<div class="box">
  <div class="lab">① 官方参数 + 自动播放（当前网站用的）</div>
  <iframe src="https://player.bilibili.com/player.html?isOutside=true&aid=114890442280099&bvid=BV1NCgVzoEG9&cid=31183339916&p=1&autoplay=1&high_quality=1&danmaku=0" allow="autoplay; fullscreen" scrolling="no" frameborder="0" allowfullscreen></iframe>
</div>

<div class="box">
  <div class="lab">② 官方参数 + 不自动播放</div>
  <iframe src="https://player.bilibili.com/player.html?isOutside=true&aid=114890442280099&bvid=BV1NCgVzoEG9&cid=31183339916&p=1&autoplay=0&high_quality=1&danmaku=0" allow="autoplay; fullscreen" scrolling="no" frameborder="0" allowfullscreen></iframe>
</div>

<div class="box">
  <div class="lab">③ 不带任何 referer（no-referrer）</div>
  <iframe referrerpolicy="no-referrer" src="https://player.bilibili.com/player.html?isOutside=true&aid=114890442280099&bvid=BV1NCgVzoEG9&cid=31183339916&p=1&autoplay=1&high_quality=1&danmaku=0" allow="autoplay; fullscreen" scrolling="no" frameborder="0" allowfullscreen></iframe>
</div>

<p style="margin-top:24px">如果三个都是黑的 → 说明 B 站不允许嵌入，我改用「点开跳 B 站」的方案。</p>
</body>
</html>
